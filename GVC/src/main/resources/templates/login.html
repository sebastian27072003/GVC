<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/gpiLogo2.jpg" type="image/x-icon">
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/3.1.1/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <title>Iniciar Sesión</title>


</head>
<style>
  /*

  *{
    text-align: center;
  }
  .center{
    float: none;
    margin: 0 auto;

  }
  html{
    background-color: #007141;
  }
  .panel-form{


    padding: 10px;
    width: 100% ;
    background: #D9D9D9;
    border: 2px solid #000000;
    border-radius: 30px;
  }

  .form-control{
    background: #D9D9D9;

  }
  div.login{


    position: absolute;
    top:0;
    bottom: 0;
    left: 0;
    right: 0;
    height: 25%;
    width: 30%;
    padding: 25px;
    padding-bottom: 300px;
    margin: auto;
    background: #EBEBEB;
    border-radius: 60px;
    box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19);

  }
  .logo{
    width: 150px;
  }
  .panel-body{
    padding: 10px;
  }
  .form-group{
    font-size: 16px;
    display: flex;
    align-items: center;
  }
  .form-control:focus{
    border-color:#F1A632;
  }
  .bx bx-home-alt{
    text-align: left;
  }
  .btn btn-success{
    padding-top: 35px;
  }
  .btn-success {
    background-color: #F1A631;
    text-shadow: none;
    font-size: 1.2em;
    padding: 15px 30px;
    margin-top: 30px;
    width: 100%;
  }

  .btn-googleLogin {
    background-color: white;
    border: none;
    color: #000;

    margin-top: 10px;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .custom-btn-padding {
    padding: 10px 20px;
  }


</style>
<body>
<div class="row">
  <div class="login">
    <img src="https://res.cloudinary.com/dsozg8sim/image/upload/v1731194432/gpiLogoBonitoUabc_ghgdup.png" alt="Logo UABCL" class="logo">
    <h1>Iniciar Sesión</h1>

    <div class="panel-header"></div>
    <div class="panel-body">

        <form action="/oauth2/authorization/google"method="POST">
          <button class="btn btn-googleLogin" type="submit">

              <img src="https://res.cloudinary.com/dsozg8sim/image/upload/v1731194318/gpigoogle_i3e0kn.png" alt="Google Logo" style="width: 20px; margin-right: 5px;">
            Inicia sesión con Google

          </button>
        </form>


      </form>

    </div>
</div>


</div>
</body>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.1.1/js/bootstrap.min.js"></script>
