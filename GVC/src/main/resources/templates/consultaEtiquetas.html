<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/Logo2.jpg" type="image/x-icon">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css">
  <title> Etiquetas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f5f5f5;
    }
    header {
      display: flex;
      align-items: center;
      padding: 20px;
      background-color: white;
    }
    header h1 {
      margin: 0;
      color: green;
    }
    header img {
      margin-right: 10px;
    }
    .header-titulo {
      display: flex;
      flex-direction: column;
      margin: 0;
    }
    main {
      margin: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }
    th {
      background-color: #f4f4f4;
    }
  </style>
</head>
<body>

<header>
  <img src="/Logo.png" height="150" width="100"/>
  <div class="header-titulo">
    <h1>Universidad Autónoma de Baja California</h1>
    <h3>SISTEMA INTEGRAL DE EVENTOS</h3>
  </div>
  <div style="margin-left: auto">
    <h1>Bienvenido, <span th:text="${nombre}">Nombre</span>!</h1>
    <p>Correo: <span th:text="${email}">Correo</span></p>
  </div>
</header>
<main>
  <h2>Consulta Etiquetas</h2>
  <table class="table table-striped table-hover mt-4">
    <thead class="table-light">
    <tr>
      <th style="text-align: center;">Nombre de etiqueta</th>
      <th style="text-align: center;">Color</th>
      <th style="text-align: center;">Descripciones</th>
      <th style="text-align: center;">Acciones</th>
    </tr>
    </thead>
    <tbody id="tabla-etiquetas">
    <tr th:each="etiqueta : ${etiquetas}" th:attr="data-id=${etiqueta.idEtiquetas}">
      <td th:text="${etiqueta.nomEtiquetas}"></td>
      <td>
        <span th:style="'background-color:' + ${etiqueta.color} + '; display:inline-block; width:20px; height:20px; margin-right:10px; border: 1px solid #000;'"></span>
        <span th:text="${etiqueta.color}"></span>
      </td>
      <td th:text="${etiqueta.descripcion}"></td>
      <td>
        <button type="button" class="btn btn-warning me-2" th:attr="onclick='editarEtiqueta(' + ${etiqueta.idEtiquetas} + ');'">
          <i class="bi bi-pencil"></i>
        </button>
        <button type="button" class="btn btn-danger me-2" th:attr="onclick='confirmarEliminacion(' + ${etiqueta.idEtiquetas} + ');'">
          <i class="bi bi-trash"></i>
        </button>
      </td>
    </tr>
    </tbody>
  </table>
</main>

<div class="modal fade" id="editarEtiquetaModal" tabindex="-1" aria-labelledby="editarEtiquetaModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="editarEtiquetaModalLabel">Editar Etiqueta</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="formEditarEtiqueta" method="post">
          <input type="hidden" id="editarIdEtiqueta" name="idEtiqueta">
          <div class="mb-3">
            <label for="editarNombre" class="form-label">Nombre de Etiqueta</label>
            <input type="text" class="form-control" id="editarNombre" name="nombre" required>
          </div>
          <div class="mb-3">
            <label for="editarColor" class="form-label">Color</label>
            <input type="color" class="form-control" id="editarColor" name="color" required>
          </div>
          <div class="mb-3">
            <label for="editarDescripcion" class="form-label">Descripción</label>
            <input type="text" class="form-control" id="editarDescripcion" name="descripcion" required>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" id="guardarCambiosBtn" onclick="guardarCambiosEtiqueta()" disabled>Guardar Cambios</button>
      </div>
    </div>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    const guardarCambiosBtn = document.getElementById("guardarCambiosBtn");
    const editarNombre = document.getElementById("editarNombre");
    const editarColor = document.getElementById("editarColor");
    const editarDescripcion = document.getElementById("editarDescripcion");

    // Función para habilitar/deshabilitar el botón de guardar
    function toggleGuardarButton() {
      if (editarNombre.value.trim() !== "" && editarColor.value.trim() !== "" && editarDescripcion.value.trim() !== "") {
        guardarCambiosBtn.disabled = false;
      } else {
        guardarCambiosBtn.disabled = true;
      }
    }

    // Eventos para monitorear cambios en los inputs y habilitar/deshabilitar el botón
    editarNombre.addEventListener("input", toggleGuardarButton);
    editarColor.addEventListener("input", toggleGuardarButton);
    editarDescripcion.addEventListener("input", toggleGuardarButton);

    window.confirmarEliminacion = function(idEtiquetas) {
      const confirmacion = confirm("¿Estás seguro de que deseas eliminar esta Etiqueta?");
      if (confirmacion) {
        console.log("ID de la etiqueta:", idEtiquetas);
        window.location.href = '/etiquetas/eliminar/' + idEtiquetas;
      } else {
        console.log("Eliminación cancelada");
      }
    };

    window.editarEtiqueta = function(idEtiquetas) {
      console.log("ID de la etiqueta a editar:", idEtiquetas);
      const fila = document.querySelector(`#tabla-etiquetas tr[data-id='${idEtiquetas}']`);
      if (fila) {
        console.log("Fila encontrada:", fila);
        const nombre = fila.querySelector('td:nth-child(1)').textContent.trim();
        const color = fila.querySelector('td:nth-child(2) span:nth-child(2)').textContent.trim();
        const descripcion = fila.querySelector('td:nth-child(3)').textContent.trim();

        console.log("Datos de la etiqueta:", { nombre, color, descripcion });

        document.getElementById('editarIdEtiqueta').value = idEtiquetas;
        editarNombre.value = nombre;
        editarColor.value = color;
        editarDescripcion.value = descripcion;

        toggleGuardarButton(); // Inicializa el estado del botón

        const editarModal = new bootstrap.Modal(document.getElementById('editarEtiquetaModal'));
        editarModal.show();
      } else {
        console.error("No se encontró la fila con el ID:", idEtiquetas);
      }
    };

    window.guardarCambiosEtiqueta = function() {
      const form = document.getElementById('formEditarEtiqueta');
      const id = document.getElementById('editarIdEtiqueta').value;
      form.action = `/etiquetas/editar/${id}`;
      form.submit();
    };
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
