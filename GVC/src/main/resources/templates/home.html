<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/gpiLogo2.jpg" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'/>
    <title>Eventos</title>
    <style>
        /* General */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }

        /* Estilo General */
        body {
            background-color: #EBEBEB;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;

            margin: 0;
            padding: 0;

        }



        .header h1 {
            margin: 0;
            font-size: 1.5em;
        }

        /* Header fijo */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background-color: #ffffff;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 2px solid #dee2e6;
        }

        /* Barra lateral */
        .leftSide-contenedor {
            width: 2.3cm; /* Ancho inicial */
            background: #007141;
            transition: width 0.3s ease-in-out;
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            z-index: 1001;
            overflow: hidden;
        }

        /* Expansión del menú al hacer hover */
        .leftSide-contenedor:hover {
            width: 10cm;
        }

        .leftSide {
            display: flex;
            flex-direction: column;
            padding: 20px;
            height: 100%;
            background-color: #007141;
        }

        .contenidoLeft {
            display: flex;
            align-items: center;
            margin-bottom: 1cm;
        }

        .contenidoLeft i {
            font-size: 3em;
            color: white;
        }

        h3 {
            font-size: 0.6cm;
            margin-left: 20px;
            color: white;
        }

        a {
            text-decoration: none;
            color: white;
        }

        a:hover {
            background: #f1a631;
        }

        .contenedorPrincipal {
            margin-left: 2.3cm; /* Ajuste inicial para el menú colapsado */
            margin-top: 70px;
            margin-bottom: 60px; /* Asegúrate de que hay espacio para el footer */
            padding-bottom: 60px; /* Espacio para el footer */
            width: calc(100% - 2.3cm);
            height: calc(100vh - 70px - 60px); /* Resta la altura del footer */
            transition: margin-left 0.3s ease-in-out, width 0.3s ease-in-out;
            overflow-y: auto;
        }


        /* Ajuste del contenedor al expandir el menú */
        .leftSide-contenedor:hover ~ .contenedorPrincipal {
            margin-left: 10cm;
            width: calc(100% - 10cm);
        }

        /* Formulario Principal */
        .Forma {
            flex: 1;
            padding: 1cm;
            background-color: white;
            margin: 1cm;
            border-radius: 20px;
            box-shadow: 15px 15px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            min-width: 900px; /* Ajusta según tus necesidades */
            min-height: 600px; /* Ajusta según tus necesidades */
        }


        h2 {
            font-size: 1.6cm;
            margin-bottom: 1.5cm;
        }

        .campo {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
        }

        .textInput {
            width: 8cm;
            height: 1cm;
            margin-bottom: 45px;
            border: 2px solid #EBEBEB;
            border-radius: 10px;
            padding: 15px;
        }

        .textInput::placeholder {
            color: gray;
            opacity: 1;
        }

        .textInput:hover,
        .textInput:focus {
            border-color: #007141;
        }

        .botones {
            display: flex;
            justify-content: space-between;
            width: 8cm;
        }

        .boton {
            width: 3.5cm;
            height: 1.5cm;
            border: none;
            border-radius: 10px;
        }

        .col-1 {
            background: #007141;
            color: white;
        }

        .col-2 {
            background: red;
            color: white;
        }

        footer {
            background-color: #003A1F; /* Color de fondo */
            color: white; /* Color del texto */
            text-align: center; /* Centrar el texto */
            padding: 10px; /* Espaciado interno */
            width: 100%; /* Ancho completo */
            position: relative; /* Cambia a relative para evitar problemas de superposición */
            z-index: 1; /* Mantiene el footer por debajo de otros elementos */
        }


        /* Estilos para la sección de usuario */
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-info i {
            font-size: 40px;
            color: #007141; /* Verde para el ícono */
        }

        .user-details h1, .user-details p {
            margin: 0;
            font-size: 14px;
            color: #333;
        }
        /* Asegúrate de que el contenido principal tenga un margen inferior */
        .contenedorPrincipal {
            margin-bottom: 60px; /* Deja espacio para el footer */
        }

        /* Estilo para el footer */
        footer {
            background-color: #003A1F; /* Color de fondo */
            color: white; /* Color del texto */
            text-align: center; /* Centrar el texto */
            padding: 10px; /* Espaciado interno */
            width: 100%; /* Ancho completo */
            position: relative; /* No superpone contenido */
            z-index: 1; /* Mantiene el footer por debajo de otros elementos */
        }

        .slider-container {
            scroll-snap-type: x mandatory;
        }
        .slider-container img {
            scroll-snap-align: center;
        }
        .slider-container {
            display: flex;
            width: 100%;
            height: 100vh;
            overflow-x: scroll;
        }

        .slider-container img {
            flex: 0 0 100%;
            width: 100%;
            object-fit: cover;
        }
        .slider-container {
            display: flex;
            width: 100%;
            height: 100vh;
            overflow-x: scroll;

            /* Vamos a añadir esto 👇 */
            scroll-snap-type: x mandatory;
        }

        .slider-container img {
            flex: 0 0 100%;
            width: 100%;
            object-fit: cover;

            /* Vamos a añadir esto 👇 */
            scroll-snap-align: center;
        }
        /* Ajuste del contenedor del carrusel */
        .carousel-container {
            max-width: 800px;  /* Tamaño máximo en ancho para el carrusel */
            margin: 0 auto;    /* Centrar el carrusel en la página */
        }

        /* Ajuste de altura y anchura de las imágenes del carrusel */
        .carousel-item img {
            width: 100%;                /* Ajuste al ancho del contenedor */
            height: auto;               /* Mantener la relación de aspecto original */
            object-fit: cover;          /* Ajuste para cubrir el área visible */
            max-height: 500px;          /* Tamaño máximo de altura */
        }

        /* Estilos para controlar las flechas de navegación del carrusel */
        .carousel-control-prev-icon,
        .carousel-control-next-icon {
            height: 30px;
            width: 30px;
            background-size: 100%, 100%;
        }

    </style>
<body>
<h1>Bienvenido, <span th:text="${nombre}">Nombre</span>!</h1>
<p>Correo: <span th:text="${email}">Correo</span></p>
</body>
</html>
