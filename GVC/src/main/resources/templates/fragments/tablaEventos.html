<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        table {
       table-layout: fixed;  /* Hace que las celdas tengan un ancho fijo */
       width: 100%;  /* Asegura que la tabla ocupe el 100% del espacio disponible */
     }
    table td, table th {
       word-wrap: break-word;
       overflow-wrap: break-word;
       white-space: normal;
       padding: 8px;
     }

   th:nth-child(4), td:nth-child(4) {
   width: 25%;

 }
    </style>
</head>
<body>
<div th:fragment="tabla-eventos">
    <table id="tabla-eventos" class="table table-striped table-hover mt-4">
        <!-- Cabecera de la tabla -->
        <thead class="table-light">
        <tr>
            <th>Nombre Evento</th>
            <th>Código</th>
            <th>Dirección/Lugar</th>
            <th>Descripción</th>
            <th>Fecha</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <!-- Cuerpo de la tabla -->
        <tbody>
        <tr th:each="evento : ${eventos}">
            <td th:text="${evento.nomEvento}"></td>
            <td th:text="${evento.idEventos}"></td>
            <td th:text="${evento.lugar}"></td>
            <td th:text="${evento.descripcion}"></td>
            <td th:text="${evento.fecha}"></td>
            <td>
                <!-- Botones de acción -->
                <button type="button" class="btn btn-success me-2"
                        th:attr="onclick='mostrarImagen(' + ${evento.idEventos} + ', \'' + ${evento.imagen} + '\')'">
                    <i class="bi bi-eye"></i>
                </button>
                <button type="button" class="btn btn-warning me-2" th:if="${rol == 'SUPERADMIN' || rol == 'ADMIN'}" th:attr="onclick='abrirModalEditar(' + ${evento.idEventos} + ');'">
                    <i class="bi bi-pencil"></i>
                </button>
                <button type="button" class="btn btn-danger me-2" th:if="${rol == 'SUPERADMIN' || rol == 'ADMIN'}" th:attr="onclick='confirmarEliminacion(' + ${evento.idEventos} + ');'">
                    <i class="bi bi-trash"></i>
                </button>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
