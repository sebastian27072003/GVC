<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
<div th:fragment="tabla-eventos">
    <tr th:each="evento : ${eventos}">
        <td th:text="${evento.nomEvento}"></td>
        <td th:text="${evento.idEventos}"></td>
        <td th:text="${evento.lugar}"></td>
        <td th:text="${evento.descripcion}"></td>
        <td th:text="${evento.fecha}"></td>
        <td>
            <button type="button" class="btn btn-success me-2"><i class="bi bi-eye"></i></button>
            <button type="button" class="btn btn-warning me-2"><i class="bi bi-pencil"></i></button>
            <button type="button" class="btn btn-danger me-2" onclick="eliminarEvento(${evento.idEventos})"><i class="bi bi-trash"></i></button>
        </td>
    </tr>
</div>
</body>
</html>
